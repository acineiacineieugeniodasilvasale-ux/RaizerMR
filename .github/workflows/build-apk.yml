name: RaizerMR Build APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'android/**'
  workflow_dispatch:

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m"'
  JAVA_TOOL_OPTIONS: '-Dfile.encoding=UTF-8'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Restore Keystore from Base64
        run: |
          mkdir -p android/app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore/release-keystore.jks
          ls -la android/app/keystore/

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Build Release APK
        working-directory: ./android
        env:
          ORG_GRADLE_PROJECT_keystoreAlias: ${{ secrets.KEYSTORE_ALIAS }}
          ORG_GRADLE_PROJECT_keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Alias: $ORG_GRADLE_PROJECT_keystoreAlias"
          ./gradlew assembleRelease --no-daemon --stacktrace --info

      - name: List APK Outputs (Debug)
        run: |
          echo "Procurando APKs de Debug..."
          find android/app/build/outputs/apk/debug -type f -name "*.apk" | sort
          
      - name: List APK Outputs (Release)
        run: |
          echo "Procurando APKs de Release..."
          find android/app/build/outputs/apk/release -type f -name "*.apk" | sort

      # Upload Dinâmico: Encontra qualquer .apk na pasta de debug
      - name: Upload Debug Artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: raizer-mr-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: warn # Avisará se não achar nada, em vez de falhar

      # Upload Dinâmico: Encontra qualquer .apk na pasta de release
      - name: Upload Release Artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: raizer-mr-release
          path: |
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Mapping File (R8/Proguard)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: raizer-mr-mapping
          path: |
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: ignore
