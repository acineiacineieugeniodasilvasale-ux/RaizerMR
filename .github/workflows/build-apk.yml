name: RaizerMR Build APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'android/**'
  workflow_dispatch:

env:
  # Otimização do Gradle para CI
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m"'
  JAVA_TOOL_OPTIONS: '-Dfile.encoding=UTF-8'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Garante histórico completo para versionamento via git

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle' # Cache automático do Gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Restore Keystore from Base64
        # Converte o segredo Base64 de volta para o arquivo .jks
        run: |
          mkdir -p android/app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore/release-keystore.jks
          ls -la android/app/keystore/

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Build Release APK
        working-directory: ./android
        # Injeta os segredos como propriedades do Gradle
        env:
          ORG_GRADLE_PROJECT_keystoreAlias: ${{ secrets.KEYSTORE_ALIAS }}
          ORG_GRADLE_PROJECT_keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Verifica se as variáveis foram setadas (debug)
          echo "Alias: $ORG_GRADLE_PROJECT_keystoreAlias"
          
          # Build com assinatura
          ./gradlew assembleRelease --no-daemon --stacktrace --info

      - name: List APK Outputs
        run: |
          echo "Arquivos gerados em android/app/build/outputs/apk:"
          find android/app/build/outputs/apk -type f -name "*.apk" -o -name "*.aab" | sort

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raizer-mr-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raizer-mr-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Mapping File (R8/Proguard)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: raizer-mr-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
